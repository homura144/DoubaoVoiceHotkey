name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Alpha release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$') {
            throw "Only explicit Alpha tags are supported by this early-Alpha workflow."
          }
          [xml]$project = Get-Content .\src\DoubaoVoiceHotkey\DoubaoVoiceHotkey.csproj
          if ("v$($project.Project.PropertyGroup.Version)" -ne $env:RELEASE_TAG) {
            throw "Tag must match the project version."
          }
          if (-not (Test-Path ".\docs\releases\$env:RELEASE_TAG.md")) {
            throw "Reviewed release notes are required."
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: >-
          dotnet publish .\src\DoubaoVoiceHotkey\DoubaoVoiceHotkey.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -o .\artifacts\win-x64
      - name: Create GitHub Alpha prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" .\artifacts\win-x64\DoubaoVoiceHotkey.exe --verify-tag --prerelease --latest=false --title "DoubaoVoiceHotkey $env:RELEASE_TAG (Alpha)" --notes-file ".\docs\releases\$env:RELEASE_TAG.md"
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed." }
          $release = gh release view "$env:RELEASE_TAG" --json isPrerelease,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.isPrerelease -or $release.isDraft) {
            throw "Expected a published prerelease."
          }
