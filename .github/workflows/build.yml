name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore .\src\DoubaoVoiceHotkey\DoubaoVoiceHotkey.csproj
      - name: Build
        run: dotnet build .\src\DoubaoVoiceHotkey\DoubaoVoiceHotkey.csproj -c Release --no-restore
      - name: Publish single-file Windows executable
        run: >-
          dotnet publish .\src\DoubaoVoiceHotkey\DoubaoVoiceHotkey.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          --no-restore
          -o .\artifacts\win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: DoubaoVoiceHotkey-win-x64
          path: artifacts/win-x64/
